name: 🎁 Build NOVA APK

on:
  push:
    branches: [ main, fix/gradle-build-mobile ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NOVA APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Télécharger NOVA
        uses: actions/checkout@v4

      - name: ☕ Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 🔎 Vérifier le projet
        run: |
          java -version
          chmod +x ./gradlew
          ./gradlew --version

      - name: 🧹 Nettoyer NOVA
        run: ./gradlew clean --no-daemon --stacktrace

      - name: 🎁 Compiler NOVA
        run: ./gradlew assembleDebug --no-daemon --stacktrace --info

      - name: 📦 Publier l’APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
